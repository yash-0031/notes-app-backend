services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: noteshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-N0teShareDb9f7Kx2mQ4zP8vL}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noteshare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-N0teShareDb9f7Kx2mQ4zP8vL}@db:5432/noteshare
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/app/scripts/entrypoint.sh"]

  celery_worker:
    build: .
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-N0teShareDb9f7Kx2mQ4zP8vL}@db:5432/noteshare
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/app/scripts/celery-entrypoint.sh"]
    command: celery -A app.tasks:celery_app worker --loglevel=info --concurrency=2

  celery_beat:
    build: .
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-N0teShareDb9f7Kx2mQ4zP8vL}@db:5432/noteshare
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/app/scripts/celery-entrypoint.sh"]
    command: celery -A app.tasks:celery_app beat --loglevel=info

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
