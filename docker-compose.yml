services:
  db:
    image: pgvector/pgvector:pg16
    container_name: noteshare_backend_db
    environment:
      POSTGRES_DB: noteshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-N0teShareDb9f7Kx2mQ4zP8vL}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noteshare"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: noteshare_backend_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend_init:
    build: .
    container_name: noteshare_backend_init_only
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-N0teShareDb9f7Kx2mQ4zP8vL}@db:5432/noteshare
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_QUERY_MAX_NOTES: ${AI_QUERY_MAX_NOTES:-50}
      AI_QUERY_SUMMARY_CHUNK_LIMIT: ${AI_QUERY_SUMMARY_CHUNK_LIMIT:-20}
      AI_QUERY_MAX_CONTEXT_CHARS: ${AI_QUERY_MAX_CONTEXT_CHARS:-12000}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/app/scripts/init.sh"]
    restart: "no"

  web:
    build: .
    container_name: noteshare_backend_web_only
    ports:
      - "${WEB_PORT:-5001}:5000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-N0teShareDb9f7Kx2mQ4zP8vL}@db:5432/noteshare
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_QUERY_MAX_NOTES: ${AI_QUERY_MAX_NOTES:-50}
      AI_QUERY_SUMMARY_CHUNK_LIMIT: ${AI_QUERY_SUMMARY_CHUNK_LIMIT:-20}
      AI_QUERY_MAX_CONTEXT_CHARS: ${AI_QUERY_MAX_CONTEXT_CHARS:-12000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend_init:
        condition: service_completed_successfully
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 wsgi:app
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: noteshare_backend_worker_only
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-N0teShareDb9f7Kx2mQ4zP8vL}@db:5432/noteshare
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_QUERY_MAX_NOTES: ${AI_QUERY_MAX_NOTES:-50}
      AI_QUERY_SUMMARY_CHUNK_LIMIT: ${AI_QUERY_SUMMARY_CHUNK_LIMIT:-20}
      AI_QUERY_MAX_CONTEXT_CHARS: ${AI_QUERY_MAX_CONTEXT_CHARS:-12000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend_init:
        condition: service_completed_successfully
    entrypoint: ["/app/scripts/celery-entrypoint.sh"]
    command: celery -A app.tasks:celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: noteshare_backend_beat_only
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-N0teShareDb9f7Kx2mQ4zP8vL}@db:5432/noteshare
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_QUERY_MAX_NOTES: ${AI_QUERY_MAX_NOTES:-50}
      AI_QUERY_SUMMARY_CHUNK_LIMIT: ${AI_QUERY_SUMMARY_CHUNK_LIMIT:-20}
      AI_QUERY_MAX_CONTEXT_CHARS: ${AI_QUERY_MAX_CONTEXT_CHARS:-12000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend_init:
        condition: service_completed_successfully
    entrypoint: ["/app/scripts/celery-entrypoint.sh"]
    command: celery -A app.tasks:celery_app beat --loglevel=info
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
